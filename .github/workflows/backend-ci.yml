name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Hanging lint should not burn 6h of runner minutes

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yali_app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: yali-backend/requirements/development.txt

      - name: Install dependencies
        run: |
          pip install -r requirements/development.txt

      - name: Black formatting check
        run: |
          black --check .

      - name: Ruff lint check
        run: |
          ruff check .

      - name: Mypy strict type check
        run: |
          python -m mypy apps/ config/ manage.py --ignore-missing-imports --no-incremental

      - name: Verify DEBUG=False in production settings
        run: |-
          python -c "
          import os
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings.production'
          os.environ['SECRET_KEY'] = 'ci-check-only-not-real-do-not-use'
          os.environ['DATABASE_URL'] = 'postgresql://yali_app:ci@localhost:5432/ci'
          os.environ['REDIS_URL'] = 'redis://localhost:6379/0'
          os.environ['ALLOWED_HOSTS'] = 'localhost'
          os.environ['JWT_SECRET_KEY'] = 'ci-check-jwt-secret'
          os.environ['QR_TOKEN_SECRET'] = 'ci-check-qr-secret'
          os.environ['TWILIO_ACCOUNT_SID'] = 'ACci'
          os.environ['TWILIO_AUTH_TOKEN'] = 'ci'
          os.environ['TWILIO_VERIFY_SERVICE_SID'] = 'VAci'
          os.environ['TWILIO_PHONE_NUMBER'] = '+10000000000'
          os.environ['R2_ACCOUNT_ID'] = 'ci'
          os.environ['R2_ACCESS_KEY_ID'] = 'ci'
          os.environ['R2_SECRET_ACCESS_KEY'] = 'ci'
          os.environ['R2_ENDPOINT_URL'] = 'https://ci.r2.cloudflarestorage.com'
          os.environ['R2_PUBLIC_URL'] = 'https://media.ci.yali.app'
          os.environ['SMS_PROVIDER'] = 'twilio'
          import django; django.setup()
          from django.conf import settings
          assert not settings.DEBUG, 'DEBUG must be False in production settings'
          print('DEBUG=False verified')
          "

      - name: Django deploy check
        run: |
          python manage.py check --deploy \
            --settings=config.settings.production \
            --fail-level WARNING
        env:
          SECRET_KEY: ci-check-only-not-real-do-not-use-in-production-x99z
          DATABASE_URL: postgresql://yali_app:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_HOSTS: api.yali.app
          JWT_SECRET_KEY: ci-check-jwt-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          QR_TOKEN_SECRET: ci-check-qr-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_ACCOUNT_SID: ACci
          TWILIO_AUTH_TOKEN: ci
          TWILIO_VERIFY_SERVICE_SID: VAci
          TWILIO_PHONE_NUMBER: "+10000000000"
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
          R2_PUBLIC_URL: https://media.ci.yali.app
          SMS_PROVIDER: twilio

      - name: Migration linter
        run: |
          python manage.py lintmigrations \
            --settings=config.settings.test \
            --warnings-as-errors \
            --sql-analyser postgresql
        env:
          DATABASE_URL: postgresql://yali_app:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-lint-only
          JWT_SECRET_KEY: ci-lint-only
          QR_TOKEN_SECRET: ci-lint-only
          TWILIO_ACCOUNT_SID: ACci
          TWILIO_AUTH_TOKEN: ci
          TWILIO_VERIFY_SERVICE_SID: VAci
          TWILIO_PHONE_NUMBER: "+10000000000"
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
          R2_PUBLIC_URL: https://media.ci.yali.app

      - name: Dependency security audit
        run: |
          pip install pip-audit --quiet
          pip-audit \
            --requirement requirements/production.txt \
            --skip-editable \
            --format columns

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality  # Only run if quality stage passes
    timeout-minutes: 30  # Full suite + coverage should never exceed 30m

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yali_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yali_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://yali_app:ci_password@localhost:5432/yali_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      QR_TOKEN_SECRET: ci-test-qr-secret-not-for-production
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci
      TWILIO_VERIFY_SERVICE_SID: VAci
      TWILIO_PHONE_NUMBER: "+10000000000"
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://media.ci.yali.app
      SMS_PROVIDER: mock

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements/test.txt

      - name: Install system dependencies
        run: sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          pip install -r requirements/test.txt

      - name: Enable btree_gist extension
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost -U yali_app -d yali_test \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput

      - name: Run test suite with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -x \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: coverage.xml
          fail_ci_if_error: false  # Coverage upload failure does not block merge

  smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: test  # Only run if the full test suite passes
    timeout-minutes: 15  # 20s k6 run + Django boot should never exceed 15m

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yali_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yali_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://yali_app:ci_password@localhost:5432/yali_smoke
      REDIS_URL: redis://localhost:6379/2
      SECRET_KEY: ci-smoke-secret-key-not-for-production
      JWT_SECRET_KEY: ci-smoke-jwt-secret-not-for-production
      QR_TOKEN_SECRET: ci-smoke-qr-secret-not-for-production
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci
      TWILIO_VERIFY_SERVICE_SID: VAci
      TWILIO_PHONE_NUMBER: "+10000000000"
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://media.ci.yali.app
      SMS_PROVIDER: mock
      K6_BASE_URL: http://localhost:8000
      K6_TEST_PHONE: "+919000099999"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: yali-backend/requirements/development.txt

      - name: Install system dependencies
        run: sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          pip install -r requirements/development.txt

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Enable btree_gist extension
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost -U yali_app -d yali_smoke \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput

      - name: Create k6 load test user
        run: |
          python manage.py create_load_test_user

      - name: Start Django server
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          echo "DJANGO_PID=$!" >> $GITHUB_ENV

      - name: Wait for Django to be ready
        run: |
          echo "Waiting for Django to start on port 8000..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/v1/health/ > /dev/null 2>&1; then
              echo "Django is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: Django not ready yet, waiting 1s..."
            sleep 1
          done
          echo "ERROR: Django did not start within 15 seconds"
          exit 1

      - name: Run k6 smoke test
        run: |
          k6 run \
            --env K6_BASE_URL=${{ env.K6_BASE_URL }} \
            --env K6_TEST_PHONE=${{ env.K6_TEST_PHONE }} \
            load-tests/k6/smoke.js

      - name: Stop Django server
        if: always()
        run: |
          if [ -n "$DJANGO_PID" ]; then
            kill $DJANGO_PID 2>/dev/null || true
          fi

  all-checks-passed:
    name: All CI checks passed
    if: always()
    needs:
      - quality
      - test
      - smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "The following required jobs failed or were cancelled:"
            echo "$failing"
            exit 1
          fi
          echo "All required checks passed."
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
