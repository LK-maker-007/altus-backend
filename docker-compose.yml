x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

x-django-env: &django-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://yali_user:yali_password@postgres:5432/yali_db
    REDIS_URL: redis://redis:6379/0
    DJANGO_SETTINGS_MODULE: config.settings.development

services:

  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: yali_user
      POSTGRES_PASSWORD: yali_password
      POSTGRES_DB: yali_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U yali_user -d yali_db"]
    networks:
      - yali_local
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    networks:
      - yali_local
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *django-env
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/ | grep -q 'ok'"]
      interval: 10s
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yali_local
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *django-env
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--queues", "default,notifications"]
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yali_local
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *django-env
    stop_signal: SIGTERM
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yali_local
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  yali_local:
    driver: bridge
