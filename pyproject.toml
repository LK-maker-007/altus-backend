[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "yali-backend"
version = "0.1.0"
requires-python = ">=3.14"

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
  native-vault
)/
'''
force-exclude = '''
/(
  native-vault
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["native-vault"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "C4",
    "T20",
    "RUF",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "RUF001", "RUF002", "E402", "E501", "RUF012", "N817"]
"scripts/**" = ["E402"]
"**/admin.py" = ["RUF012"]
"config/settings/*.py" = ["E402", "F403", "F401", "F405", "E501", "S104"]
"config/gunicorn.conf.py" = ["N999", "E501", "E402"]
"apps/core/__init__.py" = ["F401"]
"**/migrations/*.py" = ["RUF012", "E501", "E402", "S608"]
"**/management/commands/*.py" = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = false
plugins = ["mypy_django_plugin.main"]
exclude = [
    "apps/core/management/commands/seed_demo_data\\.py",
]

[[tool.mypy.overrides]]
module = "apps.core.openapi"
disable_error_code = ["no-untyped-call"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "--no-header -q -x -p no:randomly"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:django",
    "ignore::PendingDeprecationWarning:django",
    "ignore::DeprecationWarning:rest_framework",
    "ignore::pytest.PytestWarning",
    "ignore:.*HMAC key.*below the minimum recommended length.*:jwt.warnings.InsecureKeyLengthWarning",
]
